[package]
name = "girt-cli"
version = "0.2.5"
edition = "2024"
authors = ["Josh McKinney"]
description = "Command-line tool for inspecting and benchmarking Git repositories with girt"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshka/girt"
rust-version = "1.97.1"
keywords = ["git", "cli", "version-control"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "girt"
path = "src/main.rs"

[dependencies]
anstream = "1.0"
clap = { version = "4.5", features = ["derive", "string", "wrap_help"] }
# `unstable-dynamic` provides `CompleteEnv`, which completes refs and remotes from the repository.
# Pinned to a minor version because that feature's API may change between minors.
clap_complete = { version = "~4.6.11", features = ["unstable-dynamic"] }
clap_mangen = "0.3.3"
color-eyre = "0.6"
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
girt = { path = "..", version = "0.13.0", features = ["http", "ssh", "tracing"] }
tokio = { version = "1.4", features = ["rt-multi-thread"] }
tracing = "0.1.40"
tracing-error = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
