[package]
name = "girt-cli"
version = "0.1.0"
edition = "2024"
authors = ["Josh McKinney"]
description = "Command-line tool for inspecting and benchmarking Git repositories with girt"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshka/girt"
rust-version = "1.97.1"
publish = false

[[bin]]
name = "girt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
girt = { path = "..", features = ["http", "ssh"] }
tokio = { version = "1.4", features = ["rt-multi-thread"] }
