[package]
name = "girt-cli"
version = "0.1.0"
edition = "2024"
authors = ["Josh McKinney"]
description = "Command-line tool for inspecting and benchmarking Git repositories with girt"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshka/girt"
rust-version = "1.97.1"
keywords = ["git", "cli", "version-control"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "girt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
color-eyre = "0.6"
girt = { path = "..", version = "0.10.3", features = ["http", "ssh", "tracing"] }
tokio = { version = "1.4", features = ["rt-multi-thread"] }
tracing = "0.1.40"
tracing-error = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
