[line-length]
line-length = 100
reflow = true
reflow-mode = "normalize"
# Keep tables aligned even when their contents require wider lines.
tables = false

[table-format]
enabled = true
style = "aligned"

# CHANGELOG.md is generated by release-plz, which writes each entry on one line.
[per-file-ignores]
# Match the generated changelog even when paths include a checkout prefix.
"**/CHANGELOG.md" = ["MD013"]
# The benchmark MDX page embeds summary cards and layouts as HTML.
"**/site/src/content/docs/performance/jj-benchmark.mdx" = ["MD033"]
# The merging section shows Git's conflict markers as an example.
"**/site/src/content/docs/how-git-works/combining-work.mdx" = ["MD092"]
