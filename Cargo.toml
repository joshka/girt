[package]
name = "girt"
version = "0.1.0"
edition = "2024"
authors = ["Josh McKinney"]
description = "An incremental, idiomatic Rust implementation of Git"
license = "MIT OR Apache-2.0"
keywords = ["git", "version-control", "repository"]
categories = ["development-tools"]

[features]
tracing = ["dep:tracing"]
ssh = ["dep:tokio", "tokio/net"]
http = ["dep:reqwest", "dep:tokio", "dep:futures-util"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
tracing = { version = "0.1.40", optional = true, default-features = false, features = ["std"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1.4", optional = true, features = ["rt", "time", "macros"] }
flate2 = "1"
crc32fast = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1", features = ["fs", "event", "process"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }
serde_json = "1"
tokio = { version = "1.4", features = ["sync"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
rstest = { version = "0.27.0", default-features = false }

[[bench]]
name = "blobs"
harness = false

