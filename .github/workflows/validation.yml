name: Platform validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Toolchain and environment
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustc +stable -Vv
          git --version
          uname -a
      - run: cargo +stable test --locked
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable run --locked --example fetch_local
      - run: cargo +stable run --locked --example push_local
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --no-deps --document-private-items

  windows-compile:
    # This is a compile gate, not a claim of Windows repository/runtime support.
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Toolchain and environment
        run: |
          rustup toolchain install stable --profile minimal
          rustc +stable -Vv
          git --version
      - run: cargo +stable check --locked --all-targets
