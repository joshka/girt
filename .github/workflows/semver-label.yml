name: Label semver breaks

# Fork PR tokens cannot write labels. This trusted workflow only reads job metadata.
on: # zizmor: ignore[dangerous-triggers] -- metadata-only labeler; no checkout or artifacts
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  label:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # Never check out PR code or download artifacts in this privileged workflow.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const {owner, repo} = context.repo;
            const run = context.payload.workflow_run;
            if (run.path !== '.github/workflows/validation.yml') return;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, filter: 'latest', per_page: 100,
            });
            const breaking = jobs.some(job => job.name === 'Semver' && job.steps.some(step =>
              step.name === 'Record breaking change' && step.conclusion === 'success'));
            if (!breaking) return;
            // Fork workflow_run payloads can omit pull_requests entirely.
            const candidates = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: run.head_sha, per_page: 100,
            });
            for (const candidate of candidates) {
              const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: candidate.number});
              if (pr.state !== 'open' || pr.head.sha !== run.head_sha) continue;
              await github.rest.issues.addLabels({owner, repo, issue_number: pr.number, labels: ['breaking']});
            }
