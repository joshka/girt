name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A release run is the push whose commit introduces a workspace version missing
  # from crates.io. Release runs use per-commit groups so later pushes can neither
  # cancel them nor replace their pending jobs; GitHub keeps one pending job per group.
  # Later pushes never publish, so they cannot race the release commit. To recover
  # a failed publish, re-run the release commit's Release run.
  unpublished:
    name: Find unpublished versions
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: check
        # Any failure fails the run rather than treating it as a non-release run.
        run: |
          packages=$(cargo metadata --no-deps --format-version 1 --locked |
            jq -r '.packages[] | select(.publish != []) | "\(.name) \(.version) \(.manifest_path)"')
          test -n "$packages"
          release=false
          while read -r name version manifest; do
            lower=${name,,}
            case ${#lower} in
              1) path=1/$lower ;;
              2) path=2/$lower ;;
              3) path=3/${lower:0:1}/$lower ;;
              *) path=${lower:0:2}/${lower:2:2}/$lower ;;
            esac
            index=$(curl -fsS --retry 3 "https://index.crates.io/$path")
            if jq -e --arg v "$version" 'select(.vers == $v)' <<< "$index" > /dev/null; then
              continue
            fi
            echo "$name $version is not on crates.io"
            if git diff HEAD^ HEAD -- "$manifest" | grep -qxF "+version = \"$version\""; then
              echo "$name $version is introduced by this commit"
              release=true
            fi
          done <<< "$packages"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  ci:
    name: Linux publish check
    # Cancel obsolete checks, except on release runs.
    concurrency:
      group: release-plz-check-${{ needs.unpublished.outputs.release == 'true' && github.sha || github.ref }}
      cancel-in-progress: true
    needs: unpublished
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - run: rustup toolchain install stable --profile minimal
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          shared-key: release-check
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build supported Linux feature configurations
        run: |
          cargo +stable build --locked
          cargo +stable check --locked --all-targets --all-features
          cargo +stable check --locked --lib --no-default-features
          cargo +stable check --locked --lib --no-default-features --features http
          cargo +stable check --locked --lib --no-default-features --features ssh
      - name: Linux library tests
        # Tracing fixture dispatchers share tracing-core's global callsite cache.
        run: cargo +stable test --locked --all-features --lib -- --test-threads=1

  # Only release runs publish, each in its own group, so no later push can cancel
  # or displace a pending publish.
  release:
    name: Publish
    concurrency:
      group: release-plz-publish-${{ github.sha }}
      cancel-in-progress: false
    needs: [unpublished, ci]
    if: needs.unpublished.outputs.release == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - run: rustup toolchain install stable --profile minimal
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          shared-key: release
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
          config: .config/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-pr:
    name: Release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - run: rustup toolchain install stable --profile minimal
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          shared-key: release
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
          config: .config/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
