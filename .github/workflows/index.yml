name: Index validation

on:
  push:
    paths:
      - 'src/**'
      - 'tests/index.rs'
      - 'tests/colocation.rs'
      - '.github/workflows/index.yml'
  workflow_dispatch:
    inputs:
      r38_only:
        description: Reuse unaffected tracing evidence and run scoped R38 coverage
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  index:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustc +stable -Vv
          git --version
      - name: Unix filesystem
        if: runner.os != 'Windows'
        run: |
          uname -a
          df . "$(python3 -c 'import tempfile; print(tempfile.gettempdir())')"
          if [ "$RUNNER_OS" = Linux ]; then
            df -T . "$(python3 -c 'import tempfile; print(tempfile.gettempdir())')"
          else
            sw_vers
            diskutil info "$(df . | tail -1 | awk '{print $1}')"
          fi
      - name: Windows filesystem
        if: runner.os == 'Windows'
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | ConvertTo-Json -Compress
          Get-Volume | Where-Object DriveLetter | Select-Object DriveLetter, FileSystem, FileSystemLabel | ConvertTo-Json -Compress
          Write-Output "Temporary directory: $env:TEMP"
      - name: Core index and fault tests
        run: "cargo +stable test --locked --no-default-features --lib index::"
      - name: Colocation and operation faults
        run: "cargo +stable test --locked --no-default-features --lib repository::"
      - name: Both-format Git interoperability
        run: cargo +stable test --locked --no-default-features --test index --test colocation
      - name: Index tests with tracing
        run: "cargo +stable test --locked --no-default-features --features tracing --lib index::"
      - name: Colocation with tracing
        if: ${{ !inputs.r38_only }}
        run: "cargo +stable test --locked --no-default-features --features tracing --test colocation --test tracing"
      - name: R38 index and colocation with tracing
        if: ${{ inputs.r38_only }}
        run: cargo +stable test --locked --no-default-features --features tracing --test index --test colocation
      - name: R38 resource observations
        run: cargo +stable run --release --locked --no-default-features --example index_storage_resources
      - name: Public workflow
        run: cargo +stable run --locked --no-default-features --example index
      - name: Clippy
        run: cargo +stable clippy --locked --no-default-features --lib --test index --test colocation --example index --example index_storage_resources -- -D warnings
